          function tick() {
            if (token !== playToken) return;
            showFrame(mime, frames[index]);
            index += 1;
            if (index < frames.length) window.setTimeout(tick, delay);
          }
          tick();
        }

        function applyObservation(payload, playMotion) {
          if (!payload) return;
          if (typeof payload.prompt === "string" && payload.prompt.trim()) {
            shotCaption = payload.prompt.trim();
          } else if (payload.shotKind === "camera") {
            shotCaption = t("ui.worldModelViewCamera");
          } else if (payload.shotKind === "scene") {
            shotCaption = t("ui.worldModelViewScene");
          }
          if (payload.clip && Array.isArray(payload.clip.frames)) {
            playClip(payload.clip, playMotion === true);
            return;
          }
          if (payload.still && typeof payload.still.base64 === "string") {
            ++playToken;
            showFrame(payload.still.mime, payload.still.base64);
          }
        }

        async function loadObservation(opts) {
          if (!activeWorldId) return;
          const worldId = activeWorldId;
          const res = await api(
            "/v1/sessions/" +
              encodeURIComponent(worldId) +
              "/observation",
          );
          if (!res.ok) return;
          const payload = await res.json();
          if (worldId === activeWorldId) applyObservation(payload, opts && opts.play === true);
        }

        async function send() {
          const message = input.value.trim();
          if (!message || !activeWorldId || turnBusy) return;
          showError("");
          appendMessage("user", message);
          input.value = "";
          turnBusy = true;
          const watching = looksLikeView(message);
          if (watching) setGenerating(true);
          const sendBtn = document.getElementById("send");
          if (sendBtn) sendBtn.disabled = true;
          const pending = appendMessage(
            "steward",
            watching ? t("ui.observing") : t("ui.thinking"),
          );
          let first = null;
          try {
            const res = await api(
              "/v1/sessions/" + encodeURIComponent(activeWorldId) + "/commands",
              {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify({ text: message }),
                signal: AbortSignal.timeout(620000),
              },
            );
            if (!res.ok) {
              const err = await readError(res);
              setMessageBody(pending, err);
              showError(err);
              return;
            }
            const result = await res.json();
            first = Array.isArray(result) ? result[0] : result;
            setMessageBody(pending, resultText(first));
            if (first && first.intentKind === "generation.stop") {
              generationStopped = true;
              applyStreamChrome();
            }
            const observing =
              first && first.payload && first.payload.observing === true;
            if (first && first.payload) applyObservation(first.payload, watching);
            if (watching && !observing) {
              const hasView =
                first &&
                first.payload &&
                (first.payload.still || first.payload.clip);
              if (!hasView) await loadObservation({ play: true });
              void loadSurface();
            }
          } finally {
            turnBusy = false;
            if (sendBtn) sendBtn.disabled = false;
            if (!(first && first.payload && first.payload.observing === true)) {
              setGenerating(false);
            }
          }
        }

        async function control(action) {
          if (!activeWorldId) return;
          const res = await api(
            "/v1/sessions/" + encodeURIComponent(activeWorldId) + "/control",
            {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify(
                action === "step"
                  ? { action: "step", seconds: 1 }
                  : { action: action },
              ),
            },
          );
          if (!res.ok) {
            showError(await readError(res));
            return;
          }
          await fetchRuntime();
          await refreshWorlds();
          syncLiveView();
        }

        async function exportGlb() {
          if (sceneMode) { await downloadScene(); return; }
          await downloadExport("", activeWorldId + ".glb");
        }

        async function exportPack() {
          if (sceneMode) { await downloadScene(true); return; }
          await downloadExport("?profile=world_pack", "world.carina.zip");
        }

        async function downloadExport(query, fallbackName) {
          if (!activeWorldId) return;
          const res = await api(
            "/v1/sessions/" +
              encodeURIComponent(activeWorldId) +
              "/exports" +
              query,
            { method: "POST" },
          );
          if (!res.ok) {
            showError(await readError(res));
            return;
          }
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filenameFromDisposition(
            res.headers.get("content-disposition"),
            fallbackName,
          );
          a.click();
          URL.revokeObjectURL(url);
        }

        function filenameFromDisposition(header, fallbackName) {
          if (!header) return fallbackName;
          const star = header.match(/filename\*=UTF-8''([^;]+)/i);
          if (star && star[1]) {
            try {
              return decodeURIComponent(star[1]);
            } catch {
              return fallbackName;
            }
          }
          const named = header.match(/filename="([^"]+)"/);
          return named && named[1] ? named[1] : fallbackName;
        }

        function syncBackdrop() {
          const open =
            rulesDrawer.classList.contains("open") ||
            exportDrawer.classList.contains("open");
          drawerBackdrop.hidden = !open;
        }

        function setRulesOpen(open) {
          if (open) {
            exportDrawer.hidden = true;
            exportDrawer.classList.remove("open");
            toggleExport.setAttribute("aria-expanded", "false");
            toggleExport.setAttribute("aria-pressed", "false");
          }
          rulesDrawer.hidden = !open;
          rulesDrawer.classList.toggle("open", open);
          toggleRules.setAttribute("aria-expanded", open ? "true" : "false");
          toggleRules.setAttribute("aria-pressed", open ? "true" : "false");
          syncBackdrop();
          if (open) void loadCurrentDocument();
        }

        function setExportOpen(open) {
          if (open) {
            rulesDrawer.hidden = true;
            rulesDrawer.classList.remove("open");
            toggleRules.setAttribute("aria-expanded", "false");
            toggleRules.setAttribute("aria-pressed", "false");
          }
          exportDrawer.hidden = !open;
          exportDrawer.classList.toggle("open", open);
          toggleExport.setAttribute("aria-expanded", open ? "true" : "false");
          toggleExport.setAttribute("aria-pressed", open ? "true" : "false");
          syncBackdrop();
          if (open) void loadExportPanel();
        }

        function closeDrawers() {
          setRulesOpen(false);
          setExportOpen(false);
        }

        function setChatOpen(open) {
          chatEl.hidden = !open;
          appEl.classList.toggle("chat-closed", !open);
          toggleChat.setAttribute("aria-expanded", open ? "true" : "false");
          toggleChat.setAttribute("aria-pressed", open ? "true" : "false");
          window.requestAnimationFrame(resizeCanvas);
        }

        async function loadExportPanel() {
          if (sceneMode) {
            exportObjectsEl.textContent="";exportRevisionEl.textContent=sceneState ? sceneState.title || "" : "";
            (sceneState && sceneState.chunks || []).forEach(row=>{const li=document.createElement("li");li.textContent=row.id+" · "+row.triangles+" triangles";exportObjectsEl.appendChild(li);});return;
          }
          exportObjectsEl.textContent = "";
          exportRevisionEl.textContent = "";
          if (!activeWorldId) {
            exportRevisionEl.textContent = t("error.worldNotActive");
            return;
          }
          const res = await api(
            "/v1/sessions/" + encodeURIComponent(activeWorldId) + "/snapshot",
          );
          if (!res.ok) {
            exportRevisionEl.textContent = await readError(res);
            return;
          }
          const view = await res.json();
          const snapshot = view.snapshot || {};
          const revision = snapshot.revision || "";
          exportRevisionEl.textContent =
            t("ui.exportRevision") + " · " + revision;
          const objects = snapshot.objects || [];
          objects.forEach(function (item) {
            const li = document.createElement("li");
            li.textContent = item.name || item.sceneObjectId;
            exportObjectsEl.appendChild(li);
          });
        }

        async function loadCurrentDocument() {
          if (currentDoc.scope === "global") {
            const res = await api(
              "/v1/profile/documents/" + encodeURIComponent(currentDoc.id),
            );
            if (!res.ok) {
              rulesNote.textContent = await readError(res);
              return;
            }
            const doc = await res.json();
            rulesBody.value = doc.body || "";
            docHash = doc.hash || "";
            rulesNote.textContent = "";
            return;
          }
          if (!activeWorldId) {
            rulesNote.textContent = t("error.worldNotActive");
            return;
          }
          const res = await api(
            "/v1/sessions/" +
              encodeURIComponent(activeWorldId) +
              "/documents/" +
              encodeURIComponent(currentDoc.id),
          );
          if (!res.ok) {
            rulesNote.textContent = await readError(res);
            return;
          }
          const doc = await res.json();
          rulesBody.value = doc.body || "";
          docHash = doc.hash || "";
          rulesNote.textContent = "";
        }

        async function saveRules() {
          if (currentDoc.scope !== "global" && !activeWorldId) {
            rulesNote.textContent = t("error.worldNotActive");
            return;
          }
          const payload = { body: rulesBody.value };
          if (docHash) payload.expectedHash = docHash;
          const path =
            currentDoc.scope === "global"
              ? "/v1/profile/documents/" + encodeURIComponent(currentDoc.id)
              : "/v1/sessions/" +
                encodeURIComponent(activeWorldId) +
                "/documents/" +
                encodeURIComponent(currentDoc.id);
          const res = await api(path, {
            method: "PUT",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(payload),
          });
          if (!res.ok) {
            rulesNote.textContent = await readError(res);
            return;
          }
          rulesNote.textContent = t("ui.rulesSaved");
          await loadCurrentDocument();
        }

        document.querySelectorAll(".tab").forEach(function (btn) {
          btn.addEventListener("click", function () {
            currentDoc = {
              id: btn.getAttribute("data-doc"),
              scope: btn.getAttribute("data-scope"),
            };
            document.querySelectorAll(".tab").forEach(function (other) {
              other.setAttribute(
                "aria-selected",
                other === btn ? "true" : "false",
              );
            });
            void loadCurrentDocument();
          });
        });

        document.getElementById("new-world").addEventListener("click", async function () {
          const name = window.prompt(t("ui.newWorld"));
          if (!name || !name.trim()) return;
          setGenerating(true);
          try {
            const res = await api("/v1/sessions", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ name: name.trim() }),
              signal: AbortSignal.timeout(620000),
            });
            if (!res.ok) {
              showError(await readError(res));
              return;
            }
            const result = await res.json();
            const id =
              result.worldId ||
              (result.payload && result.payload.worldId) ||
              (result.payload &&
                result.payload.session &&
                result.payload.session.sessionId);
            await refreshWorlds();
            if (id) await openWorld(id);
            if (result && result.payload) applyObservation(result.payload, true);
          } finally {
            setGenerating(false);
          }
        });

        form.addEventListener("submit", function (ev) {
          ev.preventDefault();
          void send();
        });
        input.addEventListener("keydown", function (ev) {
          if (ev.key === "Enter" && !ev.shiftKey) {
            ev.preventDefault();
            form.requestSubmit();
          }
        });

        document.getElementById("pause").addEventListener("click", function () {
          void control("pause");
        });
        document.getElementById("run").addEventListener("click", function () {
          void control("run");
        });
        document.getElementById("step").addEventListener("click", function () {
          void control("step");
        });
        document.getElementById("freeze").addEventListener("click", async function () {
          if (!activeWorldId) return;
          if (sceneMode) { appendMessage("steward","三维区块在组装完成时已自动落盘。可用“导出当前三维世界”保存 GLB，生成服务离线后仍可重开。当前为参数化资产组装版本。"); return; }
          const res = await api(
            "/v1/sessions/" + encodeURIComponent(activeWorldId) + "/commands",
            {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ intentKind: "spatial.freeze", arguments: {} }),
            },
          );
          if (!res.ok) {
            showError(await readError(res));
            return;
          }
          const body = await res.json().catch(function () {
            return {};
          });
          const spoken = resultText(body);
          if (isSpokenText(spoken)) {
            appendMessage("steward", spoken);
          }
          await loadMap();
        });
        document.getElementById("export-glb").addEventListener("click", function () {
          void exportGlb();
        });
        document.getElementById("export-pack").addEventListener("click", function () {
          void exportPack();
        });
        toggleRules.addEventListener("click", function () {
          setRulesOpen(rulesDrawer.hidden);
        });
        toggleExport.addEventListener("click", function () {
          setExportOpen(exportDrawer.hidden);
        });
        toggleChat.addEventListener("click", function () {
          setChatOpen(chatEl.hidden);
        });
        document.getElementById("close-chat").addEventListener("click", function () {
          setChatOpen(false);
        });
        document.getElementById("close-rules").addEventListener("click", function () {
          setRulesOpen(false);
        });
        document.getElementById("close-export").addEventListener("click", function () {
          setExportOpen(false);
        });
        drawerBackdrop.addEventListener("click", function () {
          closeDrawers();
        });
        document.getElementById("save-rules").addEventListener("click", function () {
          void saveRules();
        });

        document.querySelectorAll("nav [data-lang]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            lang = btn.getAttribute("data-lang") === "en" ? "en" : "zh";
            applyI18n();
          });
        });

        stageEl.addEventListener("contextmenu", function (ev) {
          ev.preventDefault();
        });
        stageEl.addEventListener("pointerdown", function (ev) {
          if (ev.button !== 2) return;
          if (viewportMode() !== "play") return;
          looking = true;
          lastX = ev.clientX;
          lastY = ev.clientY;
          stageEl.classList.add("looking");
          stageEl.focus();
          try {
            stageEl.setPointerCapture(ev.pointerId);
          } catch (err) {
            /* untrusted events still look */
          }
          ev.preventDefault();
        });
        stageEl.addEventListener("pointermove", function (ev) {
          if (!looking || viewportMode() !== "play") return;
          const dx = ev.clientX - lastX;
          const dy = ev.clientY - lastY;
          lastX = ev.clientX;
          lastY = ev.clientY;
          lookBy(dx, dy);
          draw();
          queueMove();
        });
        function endLook(ev) {
          if (!looking) return;
          if (ev && ev.button !== undefined && ev.button !== 2) return;
          looking = false;
          stageEl.classList.remove("looking");
        }
        stageEl.addEventListener("pointerup", endLook);
        stageEl.addEventListener("pointercancel", endLook);

        canvas.addEventListener("pointerdown", function (ev) {
          if (ev.button !== 0 || document.pointerLockElement === canvas) return;
          if (viewportMode() !== "play") {
            canvas.focus();
            return;
          }
          dragging = true;
          dragMoved = false;
          lastX = ev.clientX;
          lastY = ev.clientY;
          canvas.focus();
          try {
            canvas.setPointerCapture(ev.pointerId);
          } catch (err) {
            /* untrusted events (tests) still look */
          }
        });
        canvas.addEventListener("pointermove", function (ev) {
          if (!dragging) return;
          const dx = ev.clientX - lastX;
          const dy = ev.clientY - lastY;
          if (Math.abs(dx) + Math.abs(dy) > 3) dragMoved = true;
          lastX = ev.clientX;
          lastY = ev.clientY;
          lookBy(dx, dy);
          draw();
          queueMove();
        });
        canvas.addEventListener("pointerup", function (ev) {
          if (surface && !inspectGeometry) { dragging = false; return; }
          if (!dragMoved) {
            selectedId = pick(ev.clientX, ev.clientY);
            updateSelected();
            if (selectedId) {
              const obj =
                mapView && mapView.objects
                  ? mapView.objects.find(function (item) {
                      return item.sceneObjectId === selectedId;
                    })
                  : null;
              if (
                obj &&
                (obj.interactionProfile === "pickup" ||
                  obj.interactionProfile === "door")
              ) {
                void interact(selectedId);
              }
            } else if (holdingId()) {
              void dropHeld();
            }
            draw();
          }
          dragging = false;
          queueMove();
        });

        window.addEventListener("keydown", function (ev) {
          if (ev.key === "Escape" || (ev.key === "Tab" && stageEl.classList.contains("exploring"))) {
            ev.preventDefault();
            ev.stopPropagation();
            exitExploration();
            if (!rulesDrawer.hidden || !exportDrawer.hidden) {
              ev.preventDefault();
              closeDrawers();
              return;
            }
          }
          if (ev.target.closest && ev.target.closest("input,textarea,select,[contenteditable=true]")) return;
          if (ev.repeat && (ev.code === "KeyE" || ev.code === "KeyG")) return;
          if (
            ev.code === "KeyW" ||
            ev.code === "KeyA" ||
            ev.code === "KeyS" ||
            ev.code === "KeyD" ||
            ev.code === "ArrowUp" ||
            ev.code === "ArrowDown" ||
            ev.code === "ArrowLeft" ||
            ev.code === "ArrowRight"
          ) {
            ev.preventDefault();
            keys[ev.code] = true;
            stageEl.focus();
            return;
          }
          if (ev.code === "KeyE") {
            if (sceneMode) return;
            ev.preventDefault();
            if (viewportMode() === "play" && !(surface && !inspectGeometry)) {
              if (document.pointerLockElement === canvas) {
                const r = canvas.getBoundingClientRect();
                selectedId = pick(r.left+r.width/2, r.top+r.height/2);
              }
              if (selectedId) void interact(selectedId);
            }
            return;
          }
          if (ev.code === "KeyG") {
            if (sceneMode) return;
            ev.preventDefault();
            if (viewportMode() === "play") void dropHeld();
            return;
          }
          keys[ev.code] = true;
        });
        window.addEventListener("keyup", function (ev) {
          keys[ev.code] = false;
        });
        function clearMoveKeys() {
          velocity.x = 0; velocity.z = 0;
          dragging = false; looking = false;
          keys.ShiftLeft = false; keys.ShiftRight = false;
          [
            "KeyW",
            "KeyA",
            "KeyS",
            "KeyD",
            "ArrowUp",
            "ArrowDown",
            "ArrowLeft",
            "ArrowRight",
          ].forEach(function (code) {
            keys[code] = false;
          });
        }

        function applyStreamChrome() {
          const runtimeDown = streamPhase === "disconnected";
          const key = streamOverlayKey(streamPhase, generationStopped, runtimeDown);
          streamOverlay.classList.remove("banner", "blocker");
          streamOverlay.hidden = true;
          if (streamPhase === "connecting" || streamPhase === "reconnecting") {
            streamOverlay.hidden = false;
            streamOverlay.classList.add("banner");
            streamOverlayText.textContent = t(key || "ui.streamConnecting");
          } else if (streamPhase === "disconnected") {
            streamOverlay.hidden = false;
            streamOverlay.classList.add("blocker");
            streamOverlayText.textContent = t(key || "ui.streamDisconnected");
          }
          const noteKey = streamPhase === "live" && generationStopped ? "ui.generationStoppedPlayable" : "";
          streamNote.textContent = noteKey ? t(noteKey) : "";
          streamNote.classList.toggle("visible", !!noteKey);
          ps2Frame.classList.toggle("hidden", streamHqFallback(streamPhase) !== "none");
        }
        function setStreamPhase(event) {
          streamPhase = nextStreamPhase(streamPhase, event);
          applyStreamChrome();
        }
        function playerUrl() {
          return pixelStreamingUrl + "/player.html";
        }
        function startPixelStream() {
          setStreamPhase("start");
          ps2Frame.src = playerUrl();
          void probeSignalling();
        }
        async function probeSignalling() {
          try {
            const res = await api("/v1/play/signalling");
            const body = await res.json();
            if (body && body.ok) {
              if (streamPhase === "disconnected") setStreamPhase("retry");
              if (streamPhase !== "live") setStreamPhase("signallingUp");
            } else {
              setStreamPhase("disconnect");
            }
          } catch (error) {
            setStreamPhase("disconnect");
          }
        }

        ps2Frame.addEventListener("load", function () {
          if (String(ps2Frame.src).indexOf("player.html") < 0) return;
          if (streamPhase === "connecting" || streamPhase === "reconnecting") {
            setStreamPhase("iceConnected");
          }
        });
        streamRetry.addEventListener("click", function () {
          setStreamPhase("retry");
          ps2Frame.src = playerUrl() + "?reconnect=" + Date.now();
          void probeSignalling();
        });
        if (hideObservationBtn) {
          hideObservationBtn.addEventListener("click", function () {
            hideObservation();
            refreshStageStatus();
          });
        }
        streamTimer = setInterval(probeSignalling, 4000);

        window.addEventListener("blur", clearMoveKeys);
        document.addEventListener("visibilitychange", function () {
          if (document.hidden) {
            if (sceneTimer) clearTimeout(sceneTimer); sceneTimer=0;
            stopAtlas();
            clearMoveKeys();
            stopPoll();
          } else if (activeWorldId) { startPoll(); if (sceneMode) void startScene(); else if (surface) startAtlas(); }
        });
        window.addEventListener("resize", resizeCanvas);

        document.querySelector(".tab").setAttribute("aria-selected", "true");
        applyI18n();
        document.getElementById("toggle-proxies").textContent=t("ui.sceneExport");
        document.getElementById("export-pack").textContent=t("ui.sceneArchive");
        resizeCanvas();
        applyStreamChrome();
        startPixelStream();
        window.requestAnimationFrame(loop);
        void refreshWorlds().then(function () {
          if (activeWorldId) void openWorld(activeWorldId);
        });
      })();
    </script>
  </body>
</html>
